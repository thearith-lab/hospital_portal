<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RokPet – ស្វែងរកមន្ទីរពេទ្យ និងគ្លីនិកនៅកម្ពុជា (prototype, sample data)">
<style>
/* base reset (normally added by the Artifact viewer) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>រកពេទ្យ PC ភ្លឺ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Noto+Sans+Khmer:wght@400;500;600&display=swap">
<style>
/* Layout: desktop app shell — top bar with role switch; public = filter rail + results, staff/admin = side nav + work area. Emergency red is the only loud color. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8EDE9; --line:#D3DBD5;
  --fg:#14231E; --muted:#56665F;
  --jade:#0D6B57; --jade-soft:#DCEFE8; --on-jade:#FFFFFF;
  --teal:#1F5F7A; --teal-soft:#DDEBF2; --on-teal:#FFFFFF;
  --red:#BF2A20; --red-soft:#FBE3E0; --on-red:#FFFFFF;
  --gold:#86621A; --gold-soft:#F5EACD;
  --open:#1F7A3A; --closed:#9A3B2E; --warn:#9A6A00;
  --f-display:"Kantumruy Pro","Noto Sans Khmer","Khmer OS",sans-serif;
  --f-body:"Noto Sans Khmer","Kantumruy Pro","Khmer OS",sans-serif;
  --r:12px;
}


*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.5;margin:0;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--jade)}
.brand svg{width:30px;height:30px}
.pnav{display:flex;gap:4px}
.pnav button{background:none;border:0;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.pnav button.on{color:var(--jade);background:var(--jade-soft)}
.sp{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;font-size:.88rem;white-space:nowrap}
.seg button.on{background:var(--jade);color:var(--on-jade)}
.demo-tag{font-size:.72rem;color:var(--gold);background:var(--gold-soft);padding:2px 10px;border-radius:99px;white-space:nowrap}

.page{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:24px 64px}
@media (max-width:640px){.page{padding-inline:16px}.top-in{padding:10px 16px}.role{width:100%;flex-wrap:wrap}.role .seg{flex-wrap:wrap;border-radius:12px}.pnav{flex-wrap:wrap}}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:500;text-decoration:none;color:var(--fg);line-height:1.4}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{border-color:transparent;background:none;color:var(--jade)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--jade);font-weight:500;text-decoration:none;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.badge{display:inline-block;font-size:.75rem;padding:1px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.7}
.badge.red{background:var(--red-soft);color:var(--red);font-weight:600}
.badge.jade{background:var(--jade-soft);color:var(--jade);font-weight:600}
.badge.teal{background:var(--teal-soft);color:var(--teal);font-weight:600}
.badge.gold{background:var(--gold-soft);color:var(--gold);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.crumbs button{background:none;border:0;padding:0;color:var(--jade)}

/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{display:flex;align-items:center;gap:16px;padding:18px 20px;border:0;border-radius:var(--r);text-align:left}
.big svg{width:44px;height:44px;flex:none}
.big b{display:block;font-family:var(--f-display);font-size:1.25rem;line-height:1.45}
.big small{font-size:.88rem;opacity:.92}
.big.er{background:var(--red);color:var(--on-red)}
.big.h24{background:var(--teal);color:var(--on-teal)}
.searchrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin-top:14px}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:1rem}
.search input:focus{border-color:var(--jade);outline:none}
.search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.14);z-index:30;max-height:60vh;overflow:auto}
.ac-g{padding:6px 14px 2px;font-size:.75rem;letter-spacing:.02em;color:var(--muted)}
.ac button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 14px}
.ac button:hover,.ac button.on{background:var(--jade-soft)}
.way{display:flex;align-items:center;gap:10px;padding:0 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:500;white-space:nowrap}
.way svg{width:22px;height:22px;color:var(--jade)}
.section{margin-top:32px;display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.specs{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.spec.more{border-style:dashed}
.spec.more .ic{background:var(--surface-2);color:var(--muted)}
.morespecs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.mspec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:.9rem}
.mspec:hover{border-color:var(--jade)}
.mspec .c{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.spec{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:.85rem;line-height:1.4;text-align:center}
.spec .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--jade-soft);color:var(--jade)}
.spec svg{width:26px;height:26px}
.spec:hover{border-color:var(--jade)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.art{display:grid;gap:6px;align-content:start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.art .t{font-family:var(--f-display);font-weight:600;line-height:1.55}
.art:hover{border-color:var(--jade)}
@media (max-width:1000px){.specs{grid-template-columns:repeat(5,1fr)}.morespecs{grid-template-columns:repeat(3,1fr)}.arts{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.specs{grid-template-columns:repeat(2,1fr)}.morespecs{grid-template-columns:1fr}.hero,.arts{grid-template-columns:1fr}.searchrow{grid-template-columns:1fr 1fr}.searchrow .search{grid-column:1/-1}.way{padding:12px}}

/* results */
.res{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:76px;display:grid;gap:16px}
.fg{display:grid;gap:6px}
.fg h3{font-size:.85rem;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--jade)}
.res-head{display:grid;gap:10px;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:99px;background:var(--jade-soft);color:var(--jade);padding:3px 10px;font-size:.82rem;font-weight:500}
.chip svg{width:14px;height:14px}
.loc{font-size:.82rem;color:var(--muted)}
.artbox{border:1.5px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px;display:grid;gap:10px;margin-bottom:14px}
.artbox-l{font-size:.82rem;color:var(--gold);font-weight:700}
.list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.artbox .list{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-top>div{min-width:0;flex:1}
.card h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.card h3 button:hover{color:var(--jade)}
.ptag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-body);font-size:.75rem;font-weight:600;margin-left:8px;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:0 8px;line-height:1.7;vertical-align:3px;white-space:nowrap}
.ptag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dist{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;align-items:center}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.st.open{color:var(--open)} .st.closed{color:var(--closed)}
.sp-list{font-size:.85rem;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.callbox{font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.callbox b{font-variant-numeric:tabular-nums;user-select:all}
.empty{padding:28px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:10px;justify-items:center}
.relarts{margin-top:24px;display:grid;gap:12px}
.emerg-h{padding:14px 18px;border-radius:var(--r);background:var(--red-soft);color:var(--red);display:grid;gap:2px;margin-bottom:14px}
.h24-h{padding:14px 18px;border-radius:var(--r);background:var(--teal-soft);color:var(--teal);display:grid;gap:2px;margin-bottom:14px}
@media (max-width:900px){.res{grid-template-columns:1fr}.rail{position:static}.list,.artbox .list{grid-template-columns:1fr}}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.aside{display:grid;gap:16px;position:sticky;top:76px}
.kv{display:grid;grid-template-columns:9em 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.hours{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.hours td{padding:5px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:600;color:var(--jade)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:linear-gradient(135deg,var(--jade-soft),var(--surface-2));display:grid;place-items:center;color:var(--muted);font-size:.78rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.82rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.lockbox{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.9rem;background:var(--surface)}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.doc:hover{border-color:var(--jade)}
.ava{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--jade-soft);color:var(--jade);font-size:1.1rem}
.doc>div{min-width:0}
.prose{display:grid;gap:14px;font-size:1.02rem;max-width:68ch}
.prose h2{font-size:1.08rem;margin-top:6px}
.prose ul{margin:0;padding-left:1.3em;display:grid;gap:4px}
.byline{display:grid;gap:4px;padding:12px 14px;border-left:3px solid var(--jade);background:var(--surface);border-radius:0 var(--r) var(--r) 0;font-size:.9rem}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.area{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.area:hover:not(:disabled){border-color:var(--jade)}
.area .c{font-size:.82rem;color:var(--muted);white-space:nowrap}
.area:disabled{opacity:.5;cursor:default}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;font-size:.88rem}
.opt[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);font-weight:600}
@media (max-width:900px){.detail{grid-template-columns:1fr}.aside{position:static}.areas{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}

/* app shell (staff / admin) */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:76px;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.side .who{padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;display:grid;gap:4px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left;font-weight:500}
.side button.on{background:var(--jade-soft);color:var(--jade)}
.side .cnt{font-size:.75rem;background:var(--red);color:var(--on-red);border-radius:99px;padding:0 8px}
.side .lk{font-size:.75rem;color:var(--muted)}
.work{display:grid;gap:18px;min-width:0}
.work-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat.alert b{color:var(--red)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td .acts{flex-wrap:nowrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:.85rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jade);outline:none}
.req{color:var(--red);margin-left:2px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.hrow{display:grid;grid-template-columns:7em 1fr 1fr auto;gap:8px;align-items:center;font-size:.9rem}
.hrow input[type=text]{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.form-acts{display:flex;gap:10px;justify-content:flex-end;grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
.note{font-size:.85rem;padding:10px 14px;border-radius:10px;background:var(--gold-soft);color:var(--gold)}
.note.jade{background:var(--jade-soft);color:var(--jade)}
.lock{display:grid;gap:10px;justify-items:start;padding:24px;border:1.5px dashed var(--gold);border-radius:var(--r);background:var(--gold-soft);color:var(--gold)}
.lock h3{color:var(--gold)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;word-break:break-all}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.hrow{grid-template-columns:1fr 1fr}}

.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:14px;font-size:.9rem;z-index:60;max-width:min(560px,calc(100vw - 32px));text-align:center}

/* ===== Bright palette — always light (no dark mode) ===== */
:root{color-scheme:light;
  --bg:#F7FCFA; --surface:#FFFFFF; --surface-2:#EDF8F4; --line:#D7EAE3;
  --fg:#16302A; --muted:#5C7169;
  --jade:#0C8565; --jade-soft:#DCF5EC; --on-jade:#FFFFFF;
  --teal:#1A7AA8; --teal-soft:#E1F1FA; --on-teal:#FFFFFF;
  --red:#D63A2F; --red-soft:#FDE8E6; --on-red:#FFFFFF;
  --gold:#B06A00; --gold-soft:#FFF3DC;
  --open:#1E8A3E; --closed:#B4442F;
}
.top{background:#FFFFFF}
.big.er{background:linear-gradient(135deg,#E5493E,#D63A2F)}
.big.h24{background:linear-gradient(135deg,#2A90C2,#1A7AA8)}
.spec .ic{background:var(--jade-soft)}
.card,.panel,.art,.spec,.way{box-shadow:0 1px 2px rgba(12,133,101,.06)}

.speclist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.speclist li{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.speclist button{display:flex;align-items:center;gap:6px;width:100%;height:100%;background:none;border:0;padding:10px 12px;text-align:left;font-size:.98rem;line-height:1.5;color:var(--fg)}
.speclist .nm{flex:1;min-width:0}
.speclist .ch{color:var(--jade);font-size:1.1rem;line-height:1}
.speclist button:hover{background:var(--jade-soft)}

function nowPP(){const d=new Date();const p=new Date(d.getTime()+d.getTimezoneOffset()*60000+7*3600000);return {day:(p.getDay()+6)%7,min:p.getHours()*60+p.getMinutes()}}
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const grp=day=>day<5?0:day===5?1:2;
function isOpen(h){if(h.hours.h24)return true;const n=nowPP();return (h.hours.g[grp(n.day)]||[]).some(([a,b])=>n.min>=toMin(a)&&n.min<toMin(b))}
function hoursLine(h,day){if(h.hours.h24)return "២៤ម៉ោង";const r=h.hours.g[grp(day)]||[];return r.length?r.map(([a,b])=>km(a)+"–"+km(b)).join(", "):"បិទ"}
function dist(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const s=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const fmtKm=d=>km(d.toFixed(1))+" គ.ម";
const mapsDir=h=>"https://www.google.com/maps/dir/?api=1&destination="+h.lat+","+h.lng;
const mapsPin=h=>"https://www.google.com/maps/search/?api=1&query="+h.lat+","+h.lng;

/* ================= search ================= */
function canonSym(text){
  const t=norm(text);if(!t)return null;
  for(const e of DB.synonyms){
    if(norm(e.canon)===t||e.vars.some(v=>norm(v)===t))return e.canon;
  }
  for(const e of DB.synonyms){
    if(norm(e.canon).includes(t)||t.includes(norm(e.canon))||e.vars.some(v=>{const n=norm(v);return n.length>1&&(t.includes(n)||n.includes(t))}))return e.canon;
  }
  return null;
}
function symMatch(h,t){
  if(!t)return false;
  const c=canonSym(t);
  return h.sym.some(s=>{const n=norm(s);return n.includes(t)||t.includes(n)||(c&&norm(c)===n)});
}
function nameMatch(h,t){return !!t&&(norm(h.km).includes(t)||norm(h.en).includes(t))}
function allSymptoms(){const s=new Set();live().forEach(h=>h.sym.forEach(x=>s.add(x)));return Array.from(s)}
function search(p){
  const t=norm(p.q||"");const F=p.f||{};
  let rows=live().map(h=>{let score=1;if(t){score=(nameMatch(h,t)?10:0)+(symMatch(h,t)?6:0)}return {h,d:dist(ME,h),score}});
  if(t)rows=rows.filter(r=>r.score>0);
  if(p.mode==="er")rows=rows.filter(r=>r.h.specs.includes("emergency"));
  if(p.mode==="h24")rows=rows.filter(r=>r.h.hours.h24);
  if(p.spec)rows=rows.filter(r=>r.h.specs.includes(p.spec));
  if(p.khan)rows=rows.filter(r=>r.h.khan===p.khan);
  if(p.sk)rows=rows.filter(r=>r.h.sk===p.sk);
  if(F.open)rows=rows.filter(r=>isOpen(r.h));
  if(F.h24)rows=rows.filter(r=>r.h.hours.h24);
  if(F.spec)rows=rows.filter(r=>r.h.specs.includes(F.spec));
  if(F.own)rows=rows.filter(r=>F.own==="pub"?isPub(r.h):!isPub(r.h));
  if(F.type)rows=rows.filter(r=>r.h.type===F.type);
  if(F.nssf)rows=rows.filter(r=>r.h.nssf);
  const sort=(p.mode==="er"||p.mode==="h24"||p.mode==="near")?"near":(p.sort||(t?"rel":"near"));
  rows.sort(sort==="near"?(a,b)=>a.d-b.d:(a,b)=>b.score-a.score||a.d-b.d);
  rows.sort((a,b)=>(isPaid(b.h)?1:0)-(isPaid(a.h)?1:0)); /* partner hospitals first (stable) */
  return {rows,sort,t};
}

  const arts=DB.articles.filter(a=>a.hosp===h.id).sort((a,b)=>b.date.localeCompare(a.date));
  const ed=p.art==="new"?{type:"notice",title:"",body:"",specs:[],author:""}:(p.art?A(p.art):null);
  const docs=DB.doctors.filter(d=>d.hosp.includes(h.id));
  return '<div class="work-h"><h1>③–⑦ អត្ថបទ</h1><button class="btn pri" type="button" data-art="new">+ សរសេរអត្ថបទថ្មី</button></div><p class="muted small">អត្ថបទមានកាលបរិច្ឆេទ។ គ្មានកំណត់ចំនួន។</p>'+
   '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>ចំណងជើង</th><th>ប្រភេទ</th><th>ស្ថានភាព</th><th>កាលបរិច្ឆេទ</th><th></th></tr></thead><tbody>'+
   (arts.length?arts.map(a=>'<tr><td>'+('<span data-raw>'+esc(a.title)+'</span>')+'</td><td>'+ANUM[a.type]+' '+ATYPE[a.type]+'</td><td>'+statusBadge(a.status)+'</td><td class="num">'+kmDate(a.date)+'</td><td><button class="btn sm" type="button" data-art="'+a.id+'">កែ</button></td></tr>').join(""):'<tr><td colspan="5" class="muted">មិនទាន់មាន</td></tr>')+'</tbody></table></div>'+
   (ed?'<form id="f-art" class="panel form" data-id="'+(p.art==="new"?"":ed.id)+'"><h2 class="field full">'+(p.art==="new"?"អត្ថបទថ្មី":"កែអត្ថបទ")+'</h2>'+
     fld("ប្រភេទ",sel("a_type",Object.keys(ATYPE).map(k=>[k,ANUM[k]+" "+ATYPE[k]]),ed.type),{req:1,for:"a_type"})+
     fld("អ្នកសរសេរ",sel("a_author",[["","—"]].concat(docs.map(d=>[d.id,d.km])),ed.author),{for:"a_author",hint:"អត្ថបទសុខភាព គួរមានឈ្មោះវេជ្ជបណ្ឌិត"})+
     fld("ចំណងជើង",inp("a_title",ed.title,"text","required"),{req:1,full:1,for:"a_title"})+
     fld("ខ្លឹមសារ",ta("a_body",ed.body,8),{req:1,full:1,for:"a_body",hint:"«## » សម្រាប់ចំណងជើងរង · «- » សម្រាប់បញ្ជី"})+
     fld("ផ្នែកពាក់ព័ន្ធ",specChecks("a_specs",ed.specs),{full:1})+
     (ed.type==="event"?'<div class="note full">អត្ថបទព្រឹត្តិការណ៍ និងប្រូម៉ូសិន ត្រូវអ្នកគ្រប់គ្រងពិនិត្យជាមុន។</div>':'')+
     '<div class="form-acts"><button class="btn" type="button" data-art="">បោះបង់</button><button class="btn" type="submit" name="act" value="draft">រក្សាទុកជាសេចក្តីព្រាង</button><button class="btn pri" type="submit" name="act" value="publish">ផ្សព្វផ្សាយ</button></div></form>':'');
};

function adminView(){
  const av=S.admin.view;
  const pend=DB.hospitals.filter(h=>h.status==="pending").length+DB.changes.length+DB.claims.length;
  const ho=DB.hospitals.filter(h=>h.route==="proxy"&&h.handover==="pending").length;
  const nav=[["overview","ទិដ្ឋភាពទូទៅ",0],["apps","ពាក្យស្នើសុំ",pend],["proxy","ចុះឈ្មោះជំនួស",0],["handover","មិនទាន់ផ្ទេរសិទ្ធិ",ho],["plans","គ្រប់គ្រងគម្រោង",0],["articles","អត្ថបទ",0],["masters","ទិន្នន័យមេ",0],["synonyms","វចនានុក្រមពាក្យដូចគ្នា",0],["templates","ទំព័រគំរូ ①②",0]];
  const side='<nav class="side" aria-label="ម៉ឺនុយអ្នកគ្រប់គ្រង"><div class="who"><b>ក្រុមការងាររកពេទ្យ</b><span class="small muted">អ្នកគ្រប់គ្រង</span></div>'+nav.map(([k,l,c])=>'<button type="button" data-av="'+k+'" class="'+(av===k?"on":"")+'"><span>'+l+'</span>'+(c?'<span class="cnt">'+km(c)+'</span>':'')+'</button>').join("")+'</nav>';
  return '<div class="shell">'+side+'<div class="work">'+(ADV[av]||ADV.overview)(S.admin.p)+'</div></div>';
}

   '<div class="stat'+(ho.length?" alert":"")+'"><span class="small muted">មិនទាន់ផ្ទេរសិទ្ធិ</span><b>'+km(ho.length)+'</b></div>'+
   '<div class="stat"><span class="small muted">មន្ទីរពេទ្យបានផ្សព្វផ្សាយ</span><b>'+km(live().length)+'</b><span class="small muted">បង់ប្រាក់ '+km(paid.length)+'</span></div>'+
   '<div class="stat"><span class="small muted">អត្ថបទបានផ្សព្វផ្សាយ</span><b>'+km(pubArts().length)+'</b></div></div>'+
   '<div class="panel"><div class="sec-h"><h3>ត្រូវធ្វើថ្ងៃនេះ</h3></div>'+
   (pend.length?'<p>• ពិនិត្យការចុះឈ្មោះថ្មី '+km(pend.length)+' <button class="link" type="button" data-av="apps">មើល ›</button></p>':'')+

   (DB.claims.length?'<p>• ពិនិត្យការស្នើសុំសិទ្ធិជាម្ចាស់ '+km(DB.claims.length)+' <button class="link" type="button" data-av="apps">មើល ›</button></p>':'')+
   ho.filter(h=>daysBetween(h.invited,TODAY)>=7).map(h=>'<p>• ទាក់ទង '+esc(h.km)+' (ផ្ញើតំណ '+km(daysBetween(h.invited,TODAY))+' ថ្ងៃមុន) <button class="link" type="button" data-av="handover">មើល ›</button></p>').join("")+
   (!pend.length&&!DB.changes.length&&!DB.claims.length&&!ho.length?'<p class="muted">គ្មានការងាររង់ចាំ</p>':'')+'</div>';
};

function suggest(v){
  const t=norm(v);if(!t)return [];
  const g=[];
  const hs=live().filter(h=>nameMatch(h,t)).slice(0,4);
  if(hs.length)g.push(["មន្ទីរពេទ្យ",hs.map(h=>({k:"h",id:h.id,label:h.km}))]);
  const pool=new Set(allSymptoms());DB.synonyms.forEach(e=>pool.add(e.canon));
  const c=canonSym(v);
  const ss=Array.from(pool).filter(s=>norm(s).includes(t)||(c&&s===c)).slice(0,5);
  if(ss.length)g.push(["រោគសញ្ញា",ss.map(s=>({k:"s",label:s}))]);
  return g;
}
function bindSearch(){
  $$(".search").forEach(box=>{
    const q=box.querySelector("input"),ac=box.querySelector(".ac");let items=[],idx=-1;
    const pick=it=>{ac.hidden=true;if(it.k==="h")go("hospital",{id:it.id});else go("results",{q:it.label})};
    q.addEventListener("input",()=>{
      const g=suggest(q.value);items=[];idx=-1;
      if(!g.length){ac.hidden=true;return}
      ac.innerHTML=g.map(([lab,arr])=>'<div class="ac-g">'+lab+'</div>'+arr.map(it=>{items.push(it);return '<button type="button" data-i="'+(items.length-1)+'">'+esc(it.label)+'</button>'}).join("")).join("");
      ac.hidden=false;translateTree(ac);
      ac.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{e.preventDefault();pick(items[+b.dataset.i])}));
    });
    q.addEventListener("blur",()=>setTimeout(()=>ac.hidden=true,150));
    q.addEventListener("keydown",e=>{
      const bs=ac.querySelectorAll("button");
      if(e.key==="ArrowDown"&&!ac.hidden){e.preventDefault();idx=Math.min(idx+1,bs.length-1);bs.forEach((b,i)=>b.classList.toggle("on",i===idx))}
      else if(e.key==="ArrowUp"&&!ac.hidden){e.preventDefault();idx=Math.max(idx-1,0);bs.forEach((b,i)=>b.classList.toggle("on",i===idx))}
      else if(e.key==="Enter"){e.preventDefault();if(idx>=0&&items[idx])pick(items[idx]);else if(q.value.trim()){ac.hidden=true;go("results",{q:q.value.trim()})}}
      else if(e.key==="Escape")ac.hidden=true;
    });
  });
}

 "មន្ទីរពេទ្យប្រើទំព័រគំរូនេះ ពេលបង្កើតទំព័រណែនាំគ្លីនិក និងវេជ្ជបណ្ឌិត។":"Hospitals use these sample pages when creating clinic introductions and doctor profiles.",
 "បានអនុម័ត · ផ្ញើដំណឹងតាមតេឡេក្រាម":"Approved · notified on Telegram","បានអនុម័ត · ផ្ទេរសិទ្ធិគ្រប់គ្រង":"Approved · management rights transferred",
 "បានអនុម័ត":"Approved","បានប្រគល់ឱ្យកែ":"Returned for changes","បានបដិសេធ":"Rejected","សូមសរសេរមូលហេតុ":"Please write a reason",
 "ឈ្មោះមន្ទីរពេទ្យ":"Hospital name"
};
const SPEC_EN={general:"General medicine",peds:"Pediatrics",dental:"Dental",obgyn:"Obstetrics & Gynecology",eye:"Ophthalmology",skin:"Dermatology",surgery:"Surgery",ortho:"Orthopedics",ent:"ENT",emergency:"Emergency",
 cardio:"Cardiology",gastro:"Gastroenterology",pulmo:"Pulmonology",neuro:"Neurology",psych:"Psychiatry",uro:"Urology",nephro:"Nephrology",endo:"Diabetes & Endocrinology",onco:"Oncology",physio:"Physiotherapy",radio:"Radiology",lab:"Laboratory"};
const KHAN_EN={dp:"Daun Penh",cm:"Chamkar Mon",tk:"Tuol Kouk","7m":"7 Makara",bkk:"Boeng Keng Kang",mc:"Mean Chey",ss:"Sen Sok",rk:"Russey Keo",ca:"Chbar Ampov",ps:"Por Senchey",dk:"Dangkao",cc:"Chroy Changvar",pn:"Prek Pnov",kb:"Kamboul"};
const SK_EN={"ផ្សារកណ្តាល ១":"Phsar Kandal 1","វត្តភ្នំ":"Wat Phnom","ស្រះចក":"Srah Chak","ទន្លេបាសាក់":"Tonle Bassac","បឹងត្របែក":"Boeng Trabek","ទួលទំពូង ១":"Toul Tumpung 1",
 "ទឹកល្អក់ ១":"Teuk Laak 1","បឹងកក់ ១":"Boeng Kak 1","ផ្សារដេប៉ូ ១":"Phsar Depou 1","មនោរម្យ":"Monourom","វាលវង់":"Veal Vong","អូរឫស្សី ១":"Ou Ruessei 1",
 "បឹងកេងកង ១":"Boeng Keng Kang 1","បឹងកេងកង ២":"Boeng Keng Kang 2","ទួលស្វាយព្រៃ ១":"Tuol Svay Prey 1","ស្ទឹងមានជ័យ ១":"Steung Meanchey 1","ចាក់អង្រែលើ":"Chak Angre Leu",
 "ទឹកថ្លា":"Tuek Thla","ភ្នំពេញថ្មី":"Phnom Penh Thmei","ឫស្សីកែវ":"Russey Keo","ទួលសង្កែ ១":"Tuol Sangke 1","ច្បារអំពៅ ១":"Chbar Ampov 1","និរោធ":"Nirouth"};
let I18N=null;
function buildDict(){
  const d=Object.assign({},EN);
  SPECS.forEach(s=>{const e=SPEC_EN[s.id];if(e){d[s.km]=e;d["ផ្នែក"+s.km]=e}});
  d["ផ្នែក"]="Specialty";
  KHANS.forEach(k=>{const e=KHAN_EN[k.id];if(e){d[k.km]=e;d["ខណ្ឌ"+k.km]="Khan "+e}});
  Object.keys(SK_EN).forEach(s=>{d[s]=SK_EN[s];d["សង្កាត់"+s]="Sangkat "+SK_EN[s]});
  DB.hospitals.forEach(h=>{if(h.en)d[h.km]=h.en});
  const keys=Object.keys(d).sort((a,b)=>b.length-a.length);
  const idx={};keys.forEach(k=>{(idx[k[0]]=idx[k[0]]||[]).push(k)});
  I18N={d,idx};
}
const isKh=c=>c>="ក"&&c<="៿";
function tr(s){
  if(!s||!/[ក-៿]/.test(s))return s;
  if(!I18N)buildDict();
  const out=[];let i=0,buf="";
  const flush=()=>{if(buf){out.push({t:buf,en:false});buf=""}};
  while(i<s.length){
    const c=s[i];const cand=I18N.idx[c];let hit=null;
    if(cand)for(const k of cand){if(s.startsWith(k,i)){hit=k;break}}
    if(hit){flush();out.push({t:I18N.d[hit],en:true});i+=hit.length}else{buf+=c;i++}
  }
  flush();
  let r="";
  out.forEach((o,j)=>{const prev=out[j-1];if(prev&&prev.en&&o.en&&!/\s$/.test(r)&&!/^\s/.test(o.t)&&o.t&&r)r+=" ";r+=o.t});
  return r.replace(/[០-៩]/g,d=>String(KD.indexOf(d))).replace(/។/g,".").replace(/៖/g,":");
}
function translateTree(root){
  if(S.lang!=="en"||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!/[ក-៿]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;if(p&&(p.closest("[data-raw]")||p.tagName==="TEXTAREA"||p.tagName==="SCRIPT"||p.tagName==="STYLE"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{n.nodeValue=tr(n.nodeValue)});
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(v&&/[ក-៿]/.test(v)&&!el.closest("[data-raw]"))el.setAttribute(a,tr(v))})});
}

render();
